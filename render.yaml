services:
  # Wonderlab Server (NestJS API Service)
  - type: web
    name: wonderlab-server
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter wonderlab-server db:generate && pnpm --filter wonderlab-server build
    startCommand: pnpm --filter wonderlab-server prisma migrate deploy && pnpm --filter wonderlab-server db:seed && pnpm --filter wonderlab-server start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: wonderlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set via Render dashboard to client domain

  # Wonderlab Client (Next.js App Router)
  - type: web
    name: wonderlab-client
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter wonderlab-client build
    startCommand: pnpm --filter wonderlab-client start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: Wonderlab
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # Set via Render dashboard to server URL, e.g. https://wonderlab-server.onrender.com/api/v1

databases:
  # Wonderlab Managed PostgreSQL Database
  - name: wonderlab-db
    plan: free
    region: oregon
    databaseName: wonderlab
    user: wonderlab_user
