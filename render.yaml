services:
  # Wonderlab Server (NestJS API Service)
  - type: web
    name: wonderlab-server
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter wonderlab-server db:generate && pnpm --filter wonderlab-server build
    startCommand: pnpm --filter wonderlab-server prisma migrate deploy && pnpm --filter wonderlab-server db:seed && pnpm --filter wonderlab-server start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: wonderlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set via Render dashboard: https://wonderlab.io.vn,https://wonderlab-client.vercel.app

databases:
  # Wonderlab Managed PostgreSQL Database
  - name: wonderlab-db
    plan: free
    region: oregon
    databaseName: wonderlab
    user: wonderlab_user
