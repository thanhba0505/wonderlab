version: 2
updates:
  # 1. Monorepo dependencies (pnpm root workspace)
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Pinned due to local font loader patch (patches/next@15.1.7.patch)
      - dependency-name: 'next'
      # Prevent breaking major upgrades monorepo-wide
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # 2. GitHub Actions CI/CD workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      prefix-development: 'ci'
      include: 'scope'
    labels:
      - 'ci'
      - 'dependencies'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
