name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Tính năng mới & Mô phỏng (Features)'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Sửa lỗi (Bug Fixes)'
    labels:
      - 'fix'
      - 'bug'
  - title: '⚡ Hiệu năng & Tái cấu trúc (Performance & Refactor)'
    labels:
      - 'perf'
      - 'refactor'
  - title: '📚 Tài liệu (Documentation)'
    labels:
      - 'docs'
      - 'documentation'
  - title: '🔧 Bảo trì & CI/CD (Maintenance)'
    labels:
      - 'chore'
      - 'ci'
      - 'test'
      - 'build'

version-resolver:
  major:
    labels:
      - 'breaking-change'
      - 'major'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'patch'
      - 'perf'
      - 'refactor'
      - 'chore'
      - 'docs'
  default: patch

template: |
  ## Wonderlab $RESOLVED_VERSION ($DATE)

  $CHANGES

  ---
  *Dự án mã nguồn mở Wonderlab — Khám phá Khoa học, Xác suất & Nghịch lý Trực quan.*
