name: 🧪 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: 🎨 Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Run unit tests
        run: pnpm test

  e2e-tests:
    name: 🛡️ E2E Tests (Database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wonderlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Run Prisma Migrations & Seed
        run: |
          cd server
          pnpm prisma migrate deploy
          pnpm db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wonderlab?schema=public

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wonderlab?schema=public

  build:
    name: 📦 Build Applications
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Build applications
        run: pnpm build

  notify-slack:
    name: 📢 Notify Slack (#ci-cd)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, e2e-tests, build]
    if: always()
    steps:
      - name: Send CI status to Central Gateway (#ci-cd)
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://central-gateway-server.onrender.com/api/v1' }}
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
          QUALITY_STATUS: ${{ needs.quality.result }}
          UNIT_STATUS: ${{ needs.unit-tests.result }}
          E2E_STATUS: ${{ needs.e2e-tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          OVERALL_STATUS="FAIL"
          if [ "$QUALITY_STATUS" = "success" ] && [ "$UNIT_STATUS" = "success" ] && [ "$E2E_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
          fi

          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          COMMIT="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          Q_UP=$(echo "$QUALITY_STATUS" | tr "[:lower:]" "[:upper:]")
          U_UP=$(echo "$UNIT_STATUS" | tr "[:lower:]" "[:upper:]")
          E_UP=$(echo "$E2E_STATUS" | tr "[:lower:]" "[:upper:]")
          B_UP=$(echo "$BUILD_STATUS" | tr "[:lower:]" "[:upper:]")

          PAYLOAD=$(cat <<EOF
          {
            "project": "wonderlab",
            "status": "$OVERALL_STATUS",
            "branch": "$REF",
            "commit": "$COMMIT",
            "trigger": "$EVENT by @$AUTHOR",
            "pipeline": {
              "Quality & Types": "$Q_UP",
              "Unit Tests": "$U_UP",
              "E2E DB Tests": "$E_UP",
              "Production Build": "$B_UP"
            },
            "runUrl": "$RUN_URL"
          }
          EOF
          )

          curl -s -X POST "$GATEWAY_URL/notifications/slack/ci" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GATEWAY_SECRET_KEY" \
            -d "$PAYLOAD" || echo "CI notification skipped or failed"
