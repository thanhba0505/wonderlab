name: 🧪 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: 🎨 Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Run unit tests
        run: pnpm test

  e2e-tests:
    name: 🛡️ E2E Tests (Database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: wonderlab
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Run Prisma Migrations & Seed
        run: |
          cd server
          pnpm prisma migrate deploy
          pnpm db:seed
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5434/wonderlab?schema=public

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5434/wonderlab?schema=public

  build:
    name: 📦 Build Applications
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter wonderlab-server db:generate

      - name: Build applications
        run: pnpm build

  notify-slack:
    name: 📢 Notify Slack (#ci-cd)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, e2e-tests, build]
    if: always()
    steps:
      - name: Send CI status to Slack #ci-cd
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          QUALITY_STATUS: ${{ needs.quality.result }}
          UNIT_STATUS: ${{ needs.unit-tests.result }}
          E2E_STATUS: ${{ needs.e2e-tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN not configured, skipping Slack notification."
            exit 0
          fi

          if [ "$QUALITY_STATUS" = "success" ] && [ "$UNIT_STATUS" = "success" ] && [ "$E2E_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ]; then
            COLOR="#10b981"
            STATUS_TEXT="SUCCESS"
            TITLE="✅ [WONDERLAB] CI Pipeline Passed"
            MENTION=""
          else
            COLOR="#ef4444"
            STATUS_TEXT="FAIL"
            TITLE="🚨 [WONDERLAB] CI Pipeline Failed"
            MENTION="• Attention: <@U08UYNPDLAU>"
          fi

          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          COMMIT="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          SHORT_SHA=$(echo "$COMMIT" | cut -c1-7)
          PAYLOAD=$(cat <<EOF
          {
            "channel": "C0CGL8EBFT2",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "$TITLE",
                  "emoji": true
                }
              }
            ],
            "attachments": [
              {
                "color": "$COLOR",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Branch:*\n\`$REF\`" },
                      { "type": "mrkdwn", "text": "*Status:*\n\`$STATUS_TEXT\`" },
                      { "type": "mrkdwn", "text": "*Commit:*\n<https://github.com/$REPO/commit/$COMMIT|\`$SHORT_SHA\`>" },
                      { "type": "mrkdwn", "text": "*Trigger:*\n\`$EVENT by @$AUTHOR\`" }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Pipeline Breakdown:*\n\`\`\`\nQuality & Types  : $QUALITY_STATUS\nUnit Tests       : $UNIT_STATUS\nE2E DB Tests     : $E2E_STATUS\nProduction Build : $BUILD_STATUS\n\`\`\`$MENTION"
                    }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "🔍 View CI Run Logs" },
                        "url": "$RUN_URL",
                        "style": "primary"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
