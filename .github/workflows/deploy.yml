name: 🚀 Deploy Production Services

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (EMERGENCY ONLY - Prefer publishing tag vX.Y.Z)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy Production Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Merge develop into main and Sync Release Version
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          chmod +x scripts/sync-release-version.sh
          ./scripts/sync-release-version.sh "$RELEASE_TAG"

      - name: Determine Target Deployment Parameters
        id: targets
        run: |
          SERVICE="${{ inputs.service || 'all' }}"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TARGET_VERSION="${BASH_REMATCH[1]}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TARGET_VERSION="${TAG#v}"
          else
            TARGET_VERSION=$(node -p "require('./package.json').version")
          fi
          RELEASE_COMMIT=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD)
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Trigger Server Deploy Hook (Render)
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'server' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_SERVER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_SERVER_DEPLOY_HOOK is not configured in Repository Secrets."
            exit 0
          fi
          echo "Triggering wonderlab-server deploy hook on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_SERVER_DEPLOY_HOOK")
          echo "Server deploy hook response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-server deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-server deployment successfully initiated."

      - name: Trigger Client Deploy Hook (Render)
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'client' }}
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_CLIENT_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_CLIENT_DEPLOY_HOOK is not configured in Repository Secrets."
            exit 0
          fi
          echo "Triggering wonderlab-client deploy hook on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_CLIENT_DEPLOY_HOOK")
          echo "Client deploy hook response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-client deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-client deployment successfully initiated."

      - name: Monitor & Verify Live Deployment Rollout
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh \
            --service "${{ steps.targets.outputs.service }}" \
            --version "${{ steps.targets.outputs.version }}" \
            --commit "${{ steps.targets.outputs.commit }}" \
            --timeout 600 \
            --interval 10 \
            --initial-delay 15

      - name: Notify Slack (#deployments)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN not configured, skipping Slack notification."
            exit 0
          fi
          DEPLOY_STATUS="${{ job.status }}"
          if [ "$DEPLOY_STATUS" = "success" ]; then
            COLOR="#10b981"
            TITLE="🚀 Wonderlab Deployment Live & Verified"
            EMOJI="✅"
          else
            COLOR="#ef4444"
            TITLE="🚨 Wonderlab Deployment Failed"
            EMOJI="❌"
          fi
          VERSION="${{ steps.targets.outputs.version }}"
          COMMIT="${{ steps.targets.outputs.commit }}"
          SERVICE="${{ steps.targets.outputs.service }}"

          PAYLOAD=$(cat <<EOF
          {
            "channel": "C0CGL8EHU9E",
            "attachments": [
              {
                "color": "$COLOR",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "$EMOJI $TITLE",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Service Target:*\n\`$SERVICE\`" },
                      { "type": "mrkdwn", "text": "*Release Version:*\n\`v$VERSION\`" },
                      { "type": "mrkdwn", "text": "*Commit SHA:*\n\`$COMMIT\`" },
                      { "type": "mrkdwn", "text": "*Environment:*\nProduction (Render + Neon)" }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "🌐 Visit Wonderlab" },
                        "url": "https://wonderlab.io.vn"
                      },
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "🩺 Health Probe" },
                        "url": "https://wonderlab.io.vn/health"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
