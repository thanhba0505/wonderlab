name: 🚀 Deploy to Render

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (EMERGENCY ONLY - Prefer publishing tag vX.Y.Z)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://wonderlab-client.onrender.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine Target Deployment Parameters
        id: targets
        run: |
          SERVICE="${{ inputs.service || 'all' }}"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TARGET_VERSION="${BASH_REMATCH[1]}"
          else
            TARGET_VERSION=$(node -p "require('./package.json').version")
          fi
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Trigger Server Deploy Hook
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'server' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_SERVER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_SERVER_DEPLOY_HOOK is not configured in Repository Secrets."
            exit 0
          fi
          echo "Triggering wonderlab-server deploy hook on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_SERVER_DEPLOY_HOOK")
          echo "Server deploy hook response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-server deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Trigger Client Deploy Hook
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'client' }}
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_CLIENT_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_CLIENT_DEPLOY_HOOK is not configured in Repository Secrets."
            exit 0
          fi
          echo "Triggering wonderlab-client deploy hook on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_CLIENT_DEPLOY_HOOK")
          echo "Client deploy hook response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-client deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Monitor & Verify Live Deployment Rollout
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh \
            --service "${{ steps.targets.outputs.service }}" \
            --version "${{ steps.targets.outputs.version }}" \
            --commit "${{ steps.targets.outputs.commit }}" \
            --timeout 600 \
            --interval 10 \
            --initial-delay 20
