name: CD Deploy to Render

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (client, server, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Report Release Deployment Context
        run: |
          echo "============================================="
          echo "Triggering Wonderlab Production Deployment on Render"
          echo "Event: ${{ github.event_name }}"
          echo "Release Tag: ${{ github.event.release.tag_name || 'Manual Dispatch' }}"
          echo "Release Name: ${{ github.event.release.name || 'Manual Dispatch' }}"
          echo "Target Service: ${{ inputs.service || 'all' }}"
          echo "============================================="

      - name: Trigger Server Deploy Hook
        if: ${{ (inputs.service == 'all' || inputs.service == 'server' || github.event_name == 'release') && env.RENDER_SERVER_DEPLOY_HOOK != '' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: |
          echo "Deploying wonderlab-server to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_SERVER_DEPLOY_HOOK")
          echo "Server deploy hook response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "::error::Failed to trigger wonderlab-server deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-server deployment successfully initiated."

      - name: Trigger Client Deploy Hook
        if: ${{ (inputs.service == 'all' || inputs.service == 'client' || github.event_name == 'release') && env.RENDER_CLIENT_DEPLOY_HOOK != '' }}
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          echo "Deploying wonderlab-client to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_CLIENT_DEPLOY_HOOK")
          echo "Client deploy hook response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "::error::Failed to trigger wonderlab-client deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-client deployment successfully initiated."

      - name: Verify Webhook Configuration
        if: ${{ env.RENDER_SERVER_DEPLOY_HOOK == '' && env.RENDER_CLIENT_DEPLOY_HOOK == '' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          echo "::warning::Neither RENDER_SERVER_DEPLOY_HOOK nor RENDER_CLIENT_DEPLOY_HOOK are set in GitHub Repository Secrets."
          echo "To enable automated deployment on release:"
          echo "1. Go to your Render Dashboard -> Service Settings -> Deploy Hook."
          echo "2. Copy the Deploy Hook URLs."
          echo "3. Add them to GitHub -> Settings -> Secrets and variables -> Actions as:"
          echo "   - RENDER_SERVER_DEPLOY_HOOK"
          echo "   - RENDER_CLIENT_DEPLOY_HOOK"
