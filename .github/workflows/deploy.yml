name: CD Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (client, server, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy notice
        run: |
          echo "Render deployment can be managed automatically via Render blueprint (render.yaml) connected to this repository."
          echo "For manual webhook triggers, set RENDER_CLIENT_DEPLOY_HOOK and/or RENDER_SERVER_DEPLOY_HOOK in GitHub repository secrets."

      - name: Trigger Client Deploy Webhook
        if: ${{ (inputs.service == 'all' || inputs.service == 'client') && env.RENDER_CLIENT_DEPLOY_HOOK != '' }}
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          curl -s -X POST "$RENDER_CLIENT_DEPLOY_HOOK"

      - name: Trigger Server Deploy Webhook
        if: ${{ (inputs.service == 'all' || inputs.service == 'server') && env.RENDER_SERVER_DEPLOY_HOOK != '' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: |
          curl -s -X POST "$RENDER_SERVER_DEPLOY_HOOK"
