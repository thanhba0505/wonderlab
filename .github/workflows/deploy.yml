name: 🚀 Deploy to Render

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (EMERGENCY ONLY - Prefer publishing tag vX.Y.Z)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server
          - db

permissions:
  contents: read
  deployments: write

jobs:
  deploy-db:
    name: 🗄️ Wonderlab DB
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'all' || inputs.service == 'db' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: Wonderlab DB
      url: https://dashboard.render.com
    steps:
      - name: Report Database Infrastructure
        run: |
          echo "============================================="
          echo "Database: Wonderlab DB (PostgreSQL 16 Alpine)"
          echo "Managed on Render Cloud Infrastructure"
          echo "Event: ${{ github.event_name }}"
          echo "Release: ${{ github.event.release.tag_name || github.ref_name || 'Manual Dispatch' }}"
          echo "============================================="

  deploy-server:
    name: 🛡️ Wonderlab Server
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'all' || inputs.service == 'server' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: Wonderlab Server
      url: https://wonderlab-server.onrender.com
    steps:
      - name: Trigger Server Deploy Hook
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_SERVER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_SERVER_DEPLOY_HOOK is not set in GitHub Repository Secrets."
            echo "To enable automated deployment, add RENDER_SERVER_DEPLOY_HOOK at Settings -> Secrets and variables -> Actions"
            exit 0
          fi
          echo "Deploying wonderlab-server to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_SERVER_DEPLOY_HOOK")
          echo "Server deploy hook response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-server deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-server deployment successfully initiated."

  deploy-client:
    name: 💻 Wonderlab Client
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'all' || inputs.service == 'client' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: Wonderlab Client
      url: https://wonderlab-client.onrender.com
    steps:
      - name: Trigger Client Deploy Hook
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_CLIENT_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_CLIENT_DEPLOY_HOOK is not set in GitHub Repository Secrets."
            echo "To enable automated deployment, add RENDER_CLIENT_DEPLOY_HOOK at Settings -> Secrets and variables -> Actions"
            exit 0
          fi
          echo "Deploying wonderlab-client to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_CLIENT_DEPLOY_HOOK")
          echo "Client deploy hook response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-client deploy hook (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "wonderlab-client deployment successfully initiated."
