name: 🚀 Deploy Production Services

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to deploy (EMERGENCY ONLY - Prefer publishing tag vX.Y.Z)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy Production Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Merge develop into main and Sync Release Version
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          chmod +x scripts/sync-release-version.sh
          ./scripts/sync-release-version.sh "$RELEASE_TAG"

      - name: Determine Target Deployment Parameters
        id: targets
        run: |
          SERVICE="${{ inputs.service || 'all' }}"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TARGET_VERSION="${BASH_REMATCH[1]}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TARGET_VERSION="${TAG#v}"
          else
            TARGET_VERSION=$(node -p "require('./package.json').version")
          fi
          RELEASE_COMMIT=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD)
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Notify Slack Deployment Started (#deployments)
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://central-gateway-server.onrender.com/api/v1' }}
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
        run: |
          VERSION="${{ steps.targets.outputs.version }}"
          COMMIT="${{ steps.targets.outputs.commit }}"
          SERVICE="${{ steps.targets.outputs.service }}"
          AUTHOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<EOF
          {
            "project": "wonderlab",
            "status": "STARTED",
            "version": "$VERSION",
            "commit": "$COMMIT",
            "target": "Production ($SERVICE)",
            "actor": "$AUTHOR",
            "runUrl": "$RUN_URL"
          }
          EOF
          )

          curl -s -X POST "$GATEWAY_URL/notifications/slack/deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GATEWAY_SECRET_KEY" \
            -d "$PAYLOAD" || echo "Deployment started notification skipped or failed"

      - name: Trigger Server Deploy (Render API)
        id: trigger_server
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'server' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVER_SERVICE_ID: ${{ secrets.RENDER_SERVER_SERVICE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY or RENDER_SERVER_SERVICE_ID not configured in Secrets."
            exit 1
          fi
          echo "Triggering wonderlab-server deploy via Render API..."
          RAW_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVER_SERVICE_ID/deploys")
          HTTP_STATUS=$(echo "$RAW_RESP" | tail -n1)
          BODY=$(echo "$RAW_RESP" | sed '$d')
          echo "Render Server Deploy API response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-server deploy (HTTP $HTTP_STATUS): $BODY"
            exit 1
          fi
          SERVER_DEPLOY_ID=$(echo "$BODY" | node -p "JSON.parse(require('fs').readFileSync(0,'utf-8')).id || ''" 2>/dev/null || echo "")
          echo "server_deploy_id=$SERVER_DEPLOY_ID" >> "$GITHUB_OUTPUT"

          echo "Recording initial GitHub Deployment for server (in_progress)..."
          GH_SERVER_DEPLOY_ID=$(gh api -X POST /repos/${{ github.repository }}/deployments \
            --input - <<< '{"ref":"main","environment":"main - wonderlab-server","description":"Server '${{ steps.targets.outputs.version }}' deploying on Render","auto_merge":false,"required_contexts":[],"production_environment":true}' \
            --jq '.id' 2>/dev/null || echo "")
          if [ -n "$GH_SERVER_DEPLOY_ID" ]; then
            gh api -X POST /repos/${{ github.repository }}/deployments/$GH_SERVER_DEPLOY_ID/statuses \
              --input - <<< '{"state":"in_progress","environment_url":"https://wonderlab-server.onrender.com/health","log_url":"https://dashboard.render.com","description":"Server '${{ steps.targets.outputs.version }}' building on Render..."}' || true
            echo "gh_server_deploy_id=$GH_SERVER_DEPLOY_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Client Deploy (Render API)
        id: trigger_client
        if: ${{ steps.targets.outputs.service == 'all' || steps.targets.outputs.service == 'client' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_CLIENT_SERVICE_ID: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_CLIENT_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY or RENDER_CLIENT_SERVICE_ID not configured in Secrets."
            exit 1
          fi
          echo "Triggering wonderlab-client deploy via Render API..."
          RAW_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_CLIENT_SERVICE_ID/deploys")
          HTTP_STATUS=$(echo "$RAW_RESP" | tail -n1)
          BODY=$(echo "$RAW_RESP" | sed '$d')
          echo "Render Client Deploy API response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger wonderlab-client deploy (HTTP $HTTP_STATUS): $BODY"
            exit 1
          fi
          CLIENT_DEPLOY_ID=$(echo "$BODY" | node -p "JSON.parse(require('fs').readFileSync(0,'utf-8')).id || ''" 2>/dev/null || echo "")
          echo "client_deploy_id=$CLIENT_DEPLOY_ID" >> "$GITHUB_OUTPUT"

          echo "Recording initial GitHub Deployment for client (in_progress)..."
          GH_CLIENT_DEPLOY_ID=$(gh api -X POST /repos/${{ github.repository }}/deployments \
            --input - <<< '{"ref":"main","environment":"main - wonderlab-client","description":"Client '${{ steps.targets.outputs.version }}' deploying on Render","auto_merge":false,"required_contexts":[],"production_environment":true}' \
            --jq '.id' 2>/dev/null || echo "")
          if [ -n "$GH_CLIENT_DEPLOY_ID" ]; then
            gh api -X POST /repos/${{ github.repository }}/deployments/$GH_CLIENT_DEPLOY_ID/statuses \
              --input - <<< '{"state":"in_progress","environment_url":"https://wonderlab.io.vn","log_url":"https://dashboard.render.com","description":"Client '${{ steps.targets.outputs.version }}' building on Render..."}' || true
            echo "gh_client_deploy_id=$GH_CLIENT_DEPLOY_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Monitor & Verify Live Deployment Rollout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVER_SERVICE_ID: ${{ secrets.RENDER_SERVER_SERVICE_ID }}
          RENDER_CLIENT_SERVICE_ID: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh \
            --service "${{ steps.targets.outputs.service }}" \
            --version "${{ steps.targets.outputs.version }}" \
            --commit "${{ steps.targets.outputs.commit }}" \
            --server-deploy-id "${{ steps.trigger_server.outputs.server_deploy_id }}" \
            --client-deploy-id "${{ steps.trigger_client.outputs.client_deploy_id }}" \
            --gh-repo "${{ github.repository }}" \
            --gh-server-deploy-id "${{ steps.trigger_server.outputs.gh_server_deploy_id }}" \
            --gh-client-deploy-id "${{ steps.trigger_client.outputs.gh_client_deploy_id }}" \
            --timeout 600 \
            --interval 10 \
            --initial-delay 15

      - name: Record Failed Deployments (Failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERVER_ID="${{ steps.trigger_server.outputs.gh_server_deploy_id }}"
          CLIENT_ID="${{ steps.trigger_client.outputs.gh_client_deploy_id }}"
          if [ -n "$SERVER_ID" ]; then
            gh api -X POST /repos/${{ github.repository }}/deployments/$SERVER_ID/statuses \
              --input - <<< '{"state":"failure","description":"Server deployment failed or timed out","log_url":"https://dashboard.render.com"}' || true
          fi
          if [ -n "$CLIENT_ID" ]; then
            gh api -X POST /repos/${{ github.repository }}/deployments/$CLIENT_ID/statuses \
              --input - <<< '{"state":"failure","description":"Client deployment failed or timed out","log_url":"https://dashboard.render.com"}' || true
          fi

      - name: Notify Slack Deployment Result (#deployments)
        if: always()
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://central-gateway-server.onrender.com/api/v1' }}
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
        run: |
          STATUS="FAIL"
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="SUCCESS"
          fi

          VERSION="${{ steps.targets.outputs.version }}"
          COMMIT="${{ steps.targets.outputs.commit }}"
          SERVICE="${{ steps.targets.outputs.service }}"
          AUTHOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<EOF
          {
            "project": "wonderlab",
            "status": "$STATUS",
            "version": "$VERSION",
            "commit": "$COMMIT",
            "target": "Production ($SERVICE)",
            "actor": "$AUTHOR",
            "appUrl": "https://wonderlab.io.vn",
            "healthUrl": "https://wonderlab.io.vn/health",
            "runUrl": "$RUN_URL"
          }
          EOF
          )

          curl -s -X POST "$GATEWAY_URL/notifications/slack/deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GATEWAY_SECRET_KEY" \
            -d "$PAYLOAD" || echo "Deployment result notification skipped or failed"
