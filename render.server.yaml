services:
  # Wonderlab Server (NestJS API Service)
  - type: web
    name: wonderlab-server
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter wonderlab-server db:generate && pnpm --filter wonderlab-server build
    startCommand: pnpm --filter wonderlab-server prisma migrate deploy && pnpm --filter wonderlab-server db:seed && pnpm --filter wonderlab-server start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Configured via Render dashboard (supports external PostgreSQL, e.g. Supabase, Neon)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Configured via Render dashboard: https://wonderlab.io.vn
      - key: GATEWAY_URL
        value: https://central-gateway-server.onrender.com/api/v1
      - key: GATEWAY_SECRET_KEY
        sync: false
      - key: S2S_ENCRYPTION_KEY
        sync: false
