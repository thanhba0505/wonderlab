services:
  # Wonderlab Client (Next.js App Router Web Service)
  - type: web
    name: wonderlab-client
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter wonderlab-client build
    startCommand: pnpm --filter wonderlab-client start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_APP_NAME
        value: Wonderlab
      - key: NEXT_PUBLIC_APP_URL
        value: https://wonderlab.io.vn
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # Configured via Render dashboard: https://wonderlab-server.onrender.com/api/v1
